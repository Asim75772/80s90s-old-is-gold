<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>80s & 90s Old Is Gold Radio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050b12;
    color:#f7f0df;
    min-height:100vh;
}

/* TOP BAR */
.topbar{
    height:45px;
    background:#05070b;
    border-bottom:1px solid #27303b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4%;
    color:#e9b957;
    font-size:14px;
}

/* HEADER */
header{
    background:#08121c;
    border-bottom:1px solid #c9963e;
    padding:18px 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.record{
    width:62px;
    height:62px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        #e6c27a 0 8px,
        #b63b26 9px 15px,
        #111 16px 25px,
        #b63b26 26px 29px,
        #111 30px);
    border:2px solid #d4a653;
    box-shadow:0 0 20px #d99b3b55;
}

.logo h1{
    font-size:32px;
    letter-spacing:1px;
}

.logo span{
    display:block;
    color:#eab957;
    letter-spacing:6px;
    font-size:13px;
    margin-top:3px;
}

.search{
    font-size:28px;
    cursor:pointer;
}

/* HERO */
.hero{
    min-height:330px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
    linear-gradient(90deg,#07111aee,#15110ceb,#07111aee),
    radial-gradient(circle at 50% 50%,#b76b25aa,transparent 55%);
}

.hero:before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border:25px solid #b4773a33;
    border-radius:50%;
    left:-120px;
    top:-80px;
    box-shadow:
        0 0 0 35px #b4773a1c,
        0 0 0 70px #b4773a12;
}

.hero:after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border:25px solid #b4773a33;
    border-radius:50%;
    right:-130px;
    bottom:-120px;
    box-shadow:
        0 0 0 35px #b4773a1c,
        0 0 0 70px #b4773a12;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero small{
    color:#f0b448;
    font-size:24px;
    font-style:italic;
    font-family:Georgia,serif;
}

.hero h2{
    font-size:65px;
    margin:8px 0;
    letter-spacing:2px;
}

.hero p{
    color:#e9b34f;
    letter-spacing:9px;
    font-size:20px;
    margin-bottom:22px;
}

.main-button{
    border:none;
    padding:15px 42px;
    border-radius:40px;
    background:#f8c967;
    color:#17130d;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px #d18a3855;
}

.main-button:hover{
    transform:scale(1.04);
}

/* RADIO AREA */
.container{
    width:92%;
    max-width:1200px;
    margin:30px auto 130px;
}

.section-title{
    color:#eab653;
    font-size:25px;
    margin-bottom:18px;
}

/* NOW PLAYING */
.now{
    background:linear-gradient(135deg,#0b1824,#101b26);
    border:1px solid #805f2c;
    border-radius:20px;
    padding:25px;
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:28px;
}

.now-disc{
    width:105px;
    height:105px;
    border-radius:50%;
    background:
    repeating-radial-gradient(circle,
    #111 0 5px,
    #252525 6px 8px);
    border:7px solid #161616;
    box-shadow:0 0 0 2px #d4a64f;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:spin 7s linear infinite;
}

.now-disc:after{
    content:"";
    width:22px;
    height:22px;
    border-radius:50%;
    background:#e6b65d;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.now-info{
    flex:1;
}

.now-info small{
    color:#e9b653;
    letter-spacing:3px;
}

.now-info h3{
    font-size:28px;
    margin:7px 0;
}

.now-info p{
    color:#9eabb7;
}

/* CHANNEL GRID */
.radio-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.radio-card{
    background:#091725;
    border:1px solid #304253;
    border-radius:18px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:.25s;
}

.radio-card:hover{
    transform:translateY(-3px);
    border-color:#e2af4f;
    box-shadow:0 8px 25px #0008;
}

.station-icon{
    width:55px;
    height:55px;
    border-radius:50%;
    flex-shrink:0;
    background:
    radial-gradient(circle,#e6c27a 0 7px,#d33b27 8px 14px,#171717 15px 23px,#111 24px);
    border:1px solid #d5a64d;
}

.station-info{
    flex:1;
    min-width:0;
}

.station-info h3{
    font-size:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.station-info p{
    color:#a8b2bd;
    font-size:12px;
    margin-top:5px;
}

.play{
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #e5b456;
    background:#f4c765;
    color:#15120c;
    font-size:18px;
    cursor:pointer;
}

/* PLAYER */
.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:90px;
    background:#03080eF7;
    border-top:1px solid #33404b;
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    padding:12px 4%;
    z-index:20;
}

.player-info{
    width:35%;
}

.player-info strong{
    display:block;
    font-size:18px;
}

.player-info span{
    color:#9ba6b0;
    font-size:13px;
}

.player-controls{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.control{
    border:none;
    background:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
}

.big-play{
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:#f6c969;
    color:#15120d;
    font-size:22px;
    cursor:pointer;
}

.volume{
    width:18%;
}

input[type=range]{
    width:100%;
    accent-color:#e9b452;
}

/* MOBILE */
@media(max-width:800px){

    .topbar{
        font-size:12px;
    }

    header{
        padding:15px 20px;
    }

    .logo h1{
        font-size:27px;
    }

    .record{
        width:55px;
        height:55px;
    }

    .hero{
        min-height:330px;
    }

    .hero h2{
        font-size:45px;
    }

    .hero small{
        font-size:20px;
    }

    .hero p{
        font-size:15px;
        letter-spacing:6px;
    }

    .radio-grid{
        grid-template-columns:1fr 1fr;
    }

    .radio-card{
        flex-direction:column;
        text-align:center;
        padding:18px 8px;
    }

    .station-info h3{
        white-space:normal;
    }

    .player{
        height:82px;
        padding:10px 18px;
    }

    .player-info{
        width:45%;
    }

    .player-info strong{
        font-size:15px;
    }

    .player-controls{
        gap:10px;
    }

    .volume{
        display:none;
    }
}

@media(max-width:480px){

    .logo h1{
        font-size:24px;
    }

    .logo span{
        font-size:10px;
    }

    .hero h2{
        font-size:42px;
    }

    .radio-grid{
        gap:10px;
    }

    .station-icon{
        width:50px;
        height:50px;
    }

    .play{
        width:42px;
        height:42px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <span>🎵 Welcome to 80s & 90s Old Is Gold</span>
    <span>📻 LIVE INTERNET RADIO</span>
</div>

<header>

    <div class="logo">
        <div class="record"></div>

        <div>
            <h1>80s & 90s</h1>
            <span>OLD IS GOLD</span>
        </div>
    </div>

    <div class="search">⌕</div>

</header>


<section class="hero">

    <div class="hero-content">

        <small>Relive The Magic Of</small>

        <h2>80s & 90s</h2>

        <p>GOLDEN RADIO</p>

        <button class="main-button" onclick="playCurrent()">
            ▶ PLAY RADIO
        </button>

    </div>

</section>


<div class="container">

    <h2 class="section-title">📻 LIVE INTERNET RADIO</h2>

    <div class="now">

        <div class="now-disc"></div>

        <div class="now-info">

            <small>NOW PLAYING</small>

            <h3 id="nowTitle">Select a Radio Station</h3>

            <p id="nowSubtitle">
                Choose your favourite old Hindi radio station below.
            </p>

        </div>

    </div>


    <div class="radio-grid" id="radioGrid"></div>

</div>


<div class="player">

    <div class="player-info">

        <strong id="playerTitle">Select a station</strong>

        <span id="playerSubtitle">
            80s & 90s Old Is Gold
        </span>

    </div>


    <div class="player-controls">

        <button class="control" onclick="previousStation()">⏮</button>

        <button class="big-play" id="playButton" onclick="togglePlay()">▶</button>

        <button class="control" onclick="nextStation()">⏭</button>

    </div>


    <div class="volume">
        🔊
        <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            onchange="setVolume(this.value)"
        >
    </div>

</div>


<audio id="radioPlayer" preload="none"></audio>


<script>

/*
========================================
80s & 90s OLD IS GOLD RADIO
========================================
Direct radio streams
*/

const stations = [

    {
        name:"Radio Bollywood 90s",
        subtitle:"90s Bollywood Classics",
        stream:"https://stream.zeno.fm/rm4i9pdex3cuv"
    },

    {
        name:"Hindi Retro",
        subtitle:"Golden Hindi Retro Hits",
        stream:"https://stream.zeno.fm/v2zfmxef798uv"
    },

    {
        name:"Lata Mangeshkar Radio",
        subtitle:"Evergreen Lata Classics",
        stream:"https://stream.zeno.fm/87xam8pf7tzuv"
    },

    {
        name:"90s Once Again",
        subtitle:"90s Romantic & Evergreen",
        stream:"https://stream.zeno.fm/rm4i9pdex3cuv"
    },

    {
        name:"Goldy Evergreen",
        subtitle:"Old Bollywood Golden Hits",
        stream:"https://stream.zeno.fm/n2fd0edh9k8uv"
    },

    {
        name:"Goldy Mukesh",
        subtitle:"Mukesh Old Is Gold",
        stream:"https://stream.zeno.fm/t39watus1p8uv"
    },

    {
        name:"Kishore Kumar Radio",
        subtitle:"Kishore Kumar Classics",
        stream:"https://stream.zeno.fm/0ghtfp8ztm0uv"
    },

    {
        name:"Mirchi Love Hindi",
        subtitle:"Bollywood Romantic Radio",
        stream:"https://drive.uber.radio/uber/bollywoodlove/icecast.audio"
    },

    {
        name:"Radio Retro Bollywood 90s",
        subtitle:"80s • 90s • Evergreen Hits",
        stream:"https://stream-143.zeno.fm/fdgs82xkzhhvv"
    },

    {
        name:"60s Forever",
        subtitle:"Golden 60s Classics",
        stream:"https://stream.zeno.fm/btrks671ynhvv"
    },

    {
        name:"Rafi Hit Songs",
        subtitle:"Mohammed Rafi Classics",
        stream:"https://stream-143.zeno.fm/0zkr7x8ztm0uv"
    },

    {
        name:"Bollywood Gaane Purane",
        subtitle:"Old Hindi Golden Hits",
        stream:"https://stream.zeno.fm/6n6ewddtad0uv"
    }

];


const audio = document.getElementById("radioPlayer");

let currentStation = 0;
let isPlaying = false;


/* CREATE STATIONS */

function loadStations(){

    const grid = document.getElementById("radioGrid");

    grid.innerHTML = "";

    stations.forEach((station,index)=>{

        const card = document.createElement("div");

        card.className = "radio-card";

        card.innerHTML = `

            <div class="station-icon"></div>

            <div class="station-info">

                <h3>📻 ${station.name}</h3>

                <p>${station.subtitle}</p>

            </div>

            <button
                class="play"
                onclick="selectStation(${index})"
            >
                ▶
            </button>

        `;

        grid.appendChild(card);

    });

}


/* SELECT STATION */

function selectStation(index){

    currentStation = index;

    const station = stations[index];

    audio.src = station.stream;

    document.getElementById("nowTitle").textContent =
        station.name;

    document.getElementById("nowSubtitle").textContent =
        station.subtitle;

    document.getElementById("playerTitle").textContent =
        station.name;

    document.getElementById("playerSubtitle").textContent =
        station.subtitle;

    audio.play()
        .then(()=>{

            isPlaying = true;

            document.getElementById("playButton").textContent="❚❚";

        })
        .catch(()=>{

            isPlaying=false;

            document.getElementById("playButton").textContent="▶";

            alert(
                "এই radio stream টি আপনার browser-এ play হচ্ছে না। অন্য station চেষ্টা করুন।"
            );

        });

}


/* PLAY CURRENT */

function playCurrent(){

    selectStation(currentStation);

}


/* PLAY / PAUSE */

function togglePlay(){

    if(!audio.src){

        playCurrent();

        return;

    }

    if(audio.paused){

        audio.play()
        .then(()=>{

            isPlaying=true;

            document.getElementById("playButton").textContent="❚❚";

        });

    }else{

        audio.pause();

        isPlaying=false;

        document.getElementById("playButton").textContent="▶";

    }

}


/* NEXT */

function nextStation(){

    currentStation++;

    if(currentStation >= stations.length){

        currentStation=0;

    }

    selectStation(currentStation);

}


/* PREVIOUS */

function previousStation(){

    currentStation--;

    if(currentStation < 0){

        currentStation=stations.length-1;

    }

    selectStation(currentStation);

}


/* VOLUME */

function setVolume(value){

    audio.volume = value;

}


/* START */

audio.volume = 0.8;

loadStations();

</script>

</body>
</html>
