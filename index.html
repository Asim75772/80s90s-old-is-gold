<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>80s & 90s Old Is Gold</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071019;
  color:white;
  padding-bottom:105px;
}

:root{
  --gold:#e8ad3b;
  --gold2:#ffd875;
  --card:#0d1b28;
  --line:#354858;
}

/* HEADER */

header{
  height:82px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 4%;
  background:#050a10;
  border-bottom:1px solid #70531f;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  width:56px;
  height:56px;
  min-width:56px;
  border:2px solid var(--gold);
  border-radius:50%;
  background:repeating-radial-gradient(
    circle,#111 0 4px,#292929 5px,#111 7px
  );
  position:relative;
}

.logo:after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--gold);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.brand{
  flex:1;
}

.brand h1{
  font-family:Georgia,serif;
  font-size:29px;
  color:#fff5df;
}

.brand small{
  color:var(--gold);
  letter-spacing:5px;
}

.header-btn{
  background:#101b26;
  border:1px solid #40515f;
  color:white;
  border-radius:22px;
  padding:9px 14px;
  cursor:pointer;
}

.header-btn:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

/* HERO */

.hero{
  width:94%;
  max-width:1400px;
  height:300px;
  margin:18px auto;
  border:1px solid #a57928;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle,#b86d2680,transparent 40%),
    linear-gradient(110deg,#16232d,#24190e,#09131c);
}

.hero:before{
  content:"📻";
  position:absolute;
  left:4%;
  bottom:-15px;
  font-size:150px;
  opacity:.35;
}

.hero:after{
  content:"💿";
  position:absolute;
  right:3%;
  top:10px;
  font-size:150px;
  opacity:.3;
}

.hero-text{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
}

.hero-text small{
  color:var(--gold);
  font:italic 24px Georgia,serif;
}

.hero-text h2{
  font:60px Georgia,serif;
  margin:5px;
  color:#fff5df;
}

.hero-text p{
  color:var(--gold);
  letter-spacing:8px;
  font-weight:bold;
}

.hero-text button{
  margin-top:20px;
  padding:13px 35px;
  border:0;
  border-radius:30px;
  background:#f4c35c;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

/* TITLE */

.title{
  width:94%;
  max-width:1400px;
  margin:25px auto 16px;
  text-align:center;
  font-size:27px;
}

.title span{
  color:var(--gold2);
}

/* CHANNELS */

.channels{
  width:94%;
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.channel{
  position:relative;
  background:linear-gradient(145deg,#102131,#08141f);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  min-height:190px;
  text-align:center;
  transition:.2s;
}

.channel:hover{
  border-color:var(--gold);
  transform:translateY(-3px);
}

.channel-icon{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:50%;
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  background:#111b24;
}

.channel h3{
  margin:11px 0 5px;
  font-size:18px;
}

.channel p{
  color:#a9b5c0;
  font-size:12px;
  min-height:30px;
}

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.play{
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:#111d27;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.play:hover{
  background:var(--gold);
  color:#111;
}

.favorite,
.more{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #485967;
  background:#101c27;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.favorite.active{
  color:#ff4050;
  border-color:#ff4050;
}

/* 3 DOT */

.menu{
  position:absolute;
  right:12px;
  bottom:60px;
  width:180px;
  background:#0d1a26;
  border:1px solid var(--gold);
  border-radius:12px;
  padding:5px;
  z-index:30;
  box-shadow:0 10px 30px #000;
}

.menu button{
  width:100%;
  border:0;
  background:none;
  color:white;
  text-align:left;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
}

.menu button:hover{
  background:#192b3a;
  color:var(--gold2);
}

/* SEARCH */

.search{
  width:94%;
  max-width:600px;
  margin:15px auto;
  display:none;
}

.search.show{
  display:block;
}

.search input{
  width:100%;
  padding:13px 18px;
  border-radius:25px;
  border:1px solid var(--gold);
  background:#0d1b28;
  color:white;
  outline:none;
}

/* FAVORITES */

.fav-title{
  width:94%;
  max-width:1400px;
  margin:20px auto;
  display:none;
  color:var(--gold2);
}

/* PLAYER */

.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:100px;
  background:#040a10;
  border-top:1px solid #a47928;
  display:flex;
  align-items:center;
  gap:18px;
  padding:10px 4%;
  z-index:100;
}

.disc{
  width:65px;
  height:65px;
  min-width:65px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:repeating-radial-gradient(
    circle,#111 0 5px,#292929 6px,#111 9px
  );
}

.now{
  flex:1;
  min-width:0;
}

.now small{
  color:var(--gold);
  letter-spacing:2px;
}

.now h3{
  margin:4px 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now p{
  color:#9ca9b5;
  font-size:12px;
}

.controls{
  display:flex;
  align-items:center;
  gap:14px;
}

.ctrl{
  background:none;
  border:0;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.big{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#f5c65d;
  border:2px solid #ffe19a;
  font-size:20px;
  cursor:pointer;
}

.volume{
  width:130px;
}

.volume input{
  width:100%;
  accent-color:var(--gold);
}

/* MOBILE */

@media(max-width:800px){

  .header-btn{
    display:none;
  }

  .channels{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .channel{
    min-height:190px;
    padding:14px 8px;
  }

  .channel h3{
    font-size:14px;
  }

  .channel p{
    font-size:10px;
  }

  .volume{
    display:none;
  }

  .player{
    height:88px;
    padding:8px 12px;
  }

  .disc{
    display:none;
  }

  .controls{
    gap:8px;
  }

  .big{
    width:54px;
    height:54px;
  }

  .ctrl{
    font-size:19px;
  }
}

@media(max-width:480px){

  .brand h1{
    font-size:22px;
  }

  .brand small{
    font-size:8px;
    letter-spacing:4px;
  }

  .hero{
    height:280px;
  }

  .hero-text h2{
    font-size:42px;
  }

  .hero-text small{
    font-size:18px;
  }

  .hero-text p{
    font-size:12px;
    letter-spacing:5px;
  }

  .channels{
    grid-template-columns:repeat(2,1fr);
  }

  .channel-icon{
    width:58px;
    height:58px;
    font-size:27px;
  }

  .favorite,
  .more{
    width:39px;
    height:39px;
  }

  .play{
    width:43px;
    height:43px;
  }

  .now h3{
    font-size:14px;
  }

  .now p{
    max-width:150px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .controls .ctrl:first-child{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo"></div>

  <div class="brand">
    <h1>80s & 90s</h1>
    <small>OLD IS GOLD</small>
  </div>

  <button class="header-btn"
          onclick="showFavorites()">
    ♥ Favorites
  </button>

  <button class="header-btn"
          onclick="toggleSearch()">
    🔍 Search
  </button>

</header>


<div class="search" id="searchBox">

  <input
    id="searchInput"
    placeholder="Search Kishore, Lata, Mukesh..."
    oninput="searchChannels()">

</div>


<section class="hero">

  <div class="hero-text">

    <small>Feel The Nostalgia</small>

    <h2>80s & 90s</h2>

    <p>OLD IS GOLD RADIO</p>

    <button onclick="playFirst()">
      ▶ PLAY RADIO
    </button>

  </div>

</section>


<h2 class="title">
  📻 <span>OLD IS GOLD RADIO CHANNELS</span>
</h2>


<div class="channels" id="channels">

  <div style="
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#e8ad3b">
    📻 Loading radio channels...
  </div>

</div>


<div class="fav-title" id="favTitle">
  ♥ MY FAVORITE CHANNELS
</div>


<div class="player">

  <div class="disc"></div>

  <div class="now">

    <small>NOW PLAYING</small>

    <h3 id="nowTitle">
      Select a Radio Channel
    </h3>

    <p id="nowDesc">
      80s & 90s Old Is Gold
    </p>

  </div>


  <div class="controls">

    <button class="ctrl"
            onclick="previous()">
      ⏮
    </button>

    <button class="big"
            id="playButton"
            onclick="togglePlay()">
      ▶
    </button>

    <button class="ctrl"
            onclick="next()">
      ⏭
    </button>

  </div>


  <div class="volume">

    🔊

    <input
      type="range"
      min="0"
      max="1"
      step=".01"
      value=".8"
      oninput="setVolume(this.value)">

  </div>

</div>


<audio id="audio"></audio>


<script>

/* =================================================
   MAIN CHANNELS
================================================= */

const channels = [

  {
    name:"Kishore Kumar Radio",
    search:[
      "Kishore Kumar",
      "Kishore"
    ],
    icon:"🎤",
    description:"Kishore Kumar • Solo & Duets"
  },

  {
    name:"Lata Mangeshkar Radio",
    search:[
      "Lata Mangeshkar",
      "Lata"
    ],
    icon:"🎤",
    description:"Lata Mangeshkar • Evergreen Hits"
  },

  {
    name:"Mukesh Radio",
    search:[
      "Mukesh"
    ],
    icon:"🎙️",
    description:"Mukesh • Old Is Gold"
  },

  {
    name:"Asha Bhosle Radio",
    search:[
      "Asha Bhosle",
      "Asha"
    ],
    icon:"🎤",
    description:"Asha Bhosle • Evergreen Songs"
  },

  {
    name:"Mohammed Rafi Radio",
    search:[
      "Mohammed Rafi",
      "Rafi"
    ],
    icon:"🎙️",
    description:"Mohammed Rafi • Golden Classics"
  },

  {
    name:"Manna Dey Radio",
    search:[
      "Manna Dey",
      "Manna"
    ],
    icon:"🎤",
    description:"Manna Dey • Golden Classics"
  },

  {
    name:"Hindi Retro Hits",
    search:[
      "Hindi Retro",
      "Retro"
    ],
    icon:"📻",
    description:"Evergreen Hindi Retro Music"
  },

  {
    name:"Bollywood 90s Radio",
    search:[
      "90s",
      "Bollywood"
    ],
    icon:"💿",
    description:"80s • 90s Bollywood Classics"
  },

  {
    name:"Hindi Evergreen",
    search:[
      "Evergreen",
      "Hindi"
    ],
    icon:"📻",
    description:"Classic Hindi Evergreen Songs"
  },

  {
    name:"Old Hindi Songs",
    search:[
      "Old Hindi",
      "Oldies"
    ],
    icon:"🎶",
    description:"Golden Era Hindi Songs"
  }

];


/* =================================================
   STATE
================================================= */

const audio =
document.getElementById("audio");

let currentChannel = -1;

let currentStream = null;

let favorites =
JSON.parse(
  localStorage.getItem(
    "oldGoldChannelFavorites"
  ) || "[]"
);


/* =================================================
   RADIO BROWSER SEARCH
================================================= */

async function findStation(channel){

  const queries =
  channel.search || [channel.name];

  for(const query of queries){

    try{

      const url =
      "https://de1.api.radio-browser.info/json/stations/search" +
      "?name=" +
      encodeURIComponent(query) +
      "&hidebroken=true" +
      "&is_https=true" +
      "&order=votes" +
      "&reverse=true" +
      "&limit=10";

      const response =
      await fetch(url);

      const data =
      await response.json();

      const usable =
      data.find(
        station =>
          station.url_resolved &&
          station.name
      );

      if(usable){

        return usable;

      }

    }
    catch(e){}

  }

  return null;
}


/* =================================================
   LOAD CHANNELS
================================================= */

async function loadChannels(){

  const box =
  document.getElementById("channels");

  box.innerHTML = "";

  for(let i=0;i<channels.length;i++){

    const channel =
    channels[i];

    const station =
    await findStation(channel);

    channel.station =
    station;

    renderChannel(
      channel,
      i
    );

  }

}


/* =================================================
   RENDER CHANNEL
================================================= */

function renderChannel(channel,index){

  const box =
  document.getElementById("channels");

  const card =
  document.createElement("div");

  card.className =
  "channel";

  const isFav =
  favorites.includes(
    index
  );

  card.innerHTML = `

    <div>

      <div class="channel-icon">
        ${channel.icon}
      </div>

      <h3>
        ${escapeHTML(channel.name)}
      </h3>

      <p>
        ${escapeHTML(channel.description)}
      </p>

    </div>


    <div class="actions">

      <button
        class="play"
        onclick="playChannel(${index})">
        ▶
      </button>


      <button
        class="favorite ${isFav ? "active":""}"
        onclick="toggleFavorite(${index},this)">
        ${isFav ? "♥":"♡"}
      </button>


      <button
        class="more"
        onclick="openMenu(event,${index})">
        ⋮
      </button>

    </div>


    <div
      class="menu"
      id="menu${index}"
      style="display:none">

      <button
        onclick="playChannel(${index});closeMenus()">
        ▶ Play Channel
      </button>

      <button
        onclick="toggleFavorite(${index});closeMenus()">
        ♥ Add / Remove Favorite
      </button>

      <button
        onclick="channelInfo(${index});closeMenus()">
        ℹ Channel Info
      </button>

    </div>

  `;

  box.appendChild(card);

}


/* =================================================
   PLAY CHANNEL
================================================= */

function playChannel(index){

  const channel =
  channels[index];

  if(!channel)
    return;

  currentChannel =
  index;

  if(!channel.station){

    alert(
      channel.name +
      " এর জন্য এখন usable online stream পাওয়া যায়নি।"
    );

    return;

  }


  const stream =
  channel.station.url_resolved;

  if(!stream){

    alert(
      "এই channel-এর stream পাওয়া যাচ্ছে না।"
    );

    return;

  }


  currentStream =
  stream;

  audio.src =
  stream;

  audio.load();


  document.getElementById(
    "nowTitle"
  ).textContent =
  channel.name;


  document.getElementById(
    "nowDesc"
  ).textContent =
  channel.description;


  audio.play()
  .then(()=>{

    document.getElementById(
      "playButton"
    ).textContent =
    "❚❚";

  })
  .catch(()=>{

    document.getElementById(
      "playButton"
    ).textContent =
    "▶";

    alert(
      "এই stream browser-এ চালানো যাচ্ছে না। অন্য channel চেষ্টা করুন।"
    );

  });

}


/* =================================================
   PLAY FIRST
================================================= */

function playFirst(){

  if(currentChannel === -1){

    playChannel(0);

  }
  else{

    togglePlay();

  }

}


/* =================================================
   TOGGLE
================================================= */

function togglePlay(){

  if(!currentStream){

    playFirst();

    return;

  }

  if(audio.paused){

    audio.play();

  }
  else{

    audio.pause();

  }

}


/* =================================================
   AUDIO EVENTS
================================================= */

audio.addEventListener(
  "play",
  function(){

    document.getElementById(
      "playButton"
    ).textContent =
    "❚❚";

  }
);

audio.addEventListener(
  "pause",
  function(){

    document.getElementById(
      "playButton"
    ).textContent =
    "▶";

  }
);


/* =================================================
   NEXT
================================================= */

function next(){

  let index =
  currentChannel + 1;

  if(index >= channels.length)
    index = 0;

  playChannel(index);

}


/* =================================================
   PREVIOUS
================================================= */

function previous(){

  let index =
  currentChannel - 1;

  if(index < 0)
    index =
    channels.length - 1;

  playChannel(index);

}


/* =================================================
   FAVORITE
================================================= */

function toggleFavorite(index,button){

  const position =
  favorites.indexOf(index);

  if(position === -1){

    favorites.push(index);

    if(button){

      button.textContent =
      "♥";

      button.classList.add(
        "active"
      );

    }

  }
  else{

    favorites.splice(
      position,
      1
    );

    if(button){

      button.textContent =
      "♡";

      button.classList.remove(
        "active"
      );

    }

  }


  localStorage.setItem(
    "oldGoldChannelFavorites",
    JSON.stringify(
      favorites
    )
  );

}


/* =================================================
   SHOW FAVORITES
================================================= */

function showFavorites(){

  const box =
  document.getElementById(
    "channels"
  );

  box.innerHTML = "";

  const list =
  favorites.map(
    index =>
    channels[index]
  ).filter(Boolean);


  if(list.length === 0){

    box.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
        color:#aaa">

        ♥ No Favorite Channels Yet

      </div>
    `;

    return;

  }


  list.forEach(channel=>{

    const index =
    channels.indexOf(
      channel
    );

    renderChannel(
      channel,
      index
    );

  });

}


/* =================================================
   SEARCH
================================================= */

function toggleSearch(){

  document
    .getElementById(
      "searchBox"
    )
    .classList.toggle(
      "show"
    );

}


function searchChannels(){

  const value =
  document
    .getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const box =
  document.getElementById(
    "channels"
  );

  box.innerHTML = "";


  channels
    .filter(channel =>

      channel.name
        .toLowerCase()
        .includes(value)

      ||

      channel.description
        .toLowerCase()
        .includes(value)

    )
    .forEach(channel=>{

      renderChannel(
        channel,
        channels.indexOf(
          channel
        )
      );

    });

}


/* =================================================
   3 DOT
================================================= */

function openMenu(event,index){

  event.stopPropagation();

  closeMenus();

  const menu =
  document.getElementById(
    "menu"+index
  );

  if(menu){

    menu.style.display =
    "block";

  }

}


function closeMenus(){

  document
    .querySelectorAll(
      ".menu"
    )
    .forEach(menu=>{

      menu.style.display =
      "none";

    });

}


document.addEventListener(
  "click",
  function(){

    closeMenus();

  }
);


/* =================================================
   CHANNEL INFO
================================================= */

function channelInfo(index){

  const channel =
  channels[index];

  if(!channel)
    return;

  if(!channel.station){

    alert(
      channel.name +
      "\n\nNo live stream was found."
    );

    return;

  }


  alert(
    "📻 " +
    channel.name +
    "\n\n" +
    "Station: " +
    channel.station.name +
    "\n" +
    "Country: " +
    (channel.station.country || "Unknown") +
    "\n" +
    "Language: " +
    (channel.station.language || "Unknown")
  );

}


/* =================================================
   SAFE TEXT
================================================= */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================================
   VOLUME
================================================= */

function setVolume(value){

  audio.volume =
  Number(value);

}

audio.volume =
0.8;


/* =================================================
   START
================================================= */
