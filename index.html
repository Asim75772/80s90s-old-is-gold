<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071019">

<title>80s & 90s Old Is Gold Radio</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#071019;
    color:#fff;
    padding-bottom:105px;
}

:root{
    --gold:#e8ad3b;
    --gold2:#ffd875;
    --card:#0d1b28;
    --line:#354858;
}

/* HEADER */

header{
    height:82px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 4%;
    background:#050a10;
    border-bottom:1px solid #70531f;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:56px;
    height:56px;
    min-width:56px;
    border:2px solid var(--gold);
    border-radius:50%;
    background:repeating-radial-gradient(
        circle,#111 0 4px,#292929 5px,#111 7px
    );
    position:relative;
}

.logo:after{
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--gold);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.brand{
    flex:1;
}

.brand h1{
    font:29px Georgia,serif;
    color:#fff5df;
}

.brand small{
    color:var(--gold);
    letter-spacing:5px;
}

.head-btn{
    background:#101b26;
    border:1px solid #40515f;
    color:#fff;
    padding:9px 14px;
    border-radius:22px;
    cursor:pointer;
}

/* HERO */

.hero{
    width:94%;
    max-width:1400px;
    height:300px;
    margin:18px auto;
    border:1px solid #a57928;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle,#b86d2680,transparent 40%),
    linear-gradient(110deg,#16232d,#24190e,#09131c);
}

.hero:before{
    content:"📻";
    position:absolute;
    left:4%;
    bottom:-15px;
    font-size:150px;
    opacity:.35;
}

.hero:after{
    content:"💿";
    position:absolute;
    right:3%;
    top:10px;
    font-size:150px;
    opacity:.3;
}

.hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content small{
    color:var(--gold);
    font:italic 24px Georgia,serif;
}

.hero-content h2{
    font:60px Georgia,serif;
    color:#fff5df;
    margin:5px;
}

.hero-content p{
    color:var(--gold);
    letter-spacing:8px;
    font-weight:bold;
}

.hero-content button{
    margin-top:20px;
    padding:13px 35px;
    border:0;
    border-radius:30px;
    background:#f4c35c;
    color:#111;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* TITLE */

.title{
    width:94%;
    max-width:1400px;
    margin:25px auto 16px;
    text-align:center;
    font-size:27px;
}

.title span{
    color:var(--gold2);
}

/* CHANNELS */

.channels{
    width:94%;
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.channel{
    position:relative;
    background:linear-gradient(145deg,#102131,#08141f);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    min-height:210px;
    text-align:center;
    transition:.2s;
}

.channel:hover{
    border-color:var(--gold);
    transform:translateY(-2px);
}

.channel-icon{
    width:68px;
    height:68px;
    margin:auto;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    background:#111b24;
}

.channel h3{
    margin:10px 0 5px;
    font-size:18px;
}

.channel p{
    color:#a9b5c0;
    font-size:12px;
    min-height:32px;
}

.status{
    font-size:11px;
    color:#63d47d;
    margin-top:5px;
}

.status.off{
    color:#e8ad3b;
}

/* BUTTONS */

.actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:12px;
}

.play,
.favorite,
.more{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

.play{
    width:46px;
    height:46px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:#111d27;
    color:white;
    font-size:18px;
}

.favorite,
.more{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #485967;
    background:#101c27;
    color:white;
    font-size:22px;
}

.favorite.active{
    color:#ff4050;
    border-color:#ff4050;
}

/* MENU */

.menu{
    position:absolute;
    right:10px;
    bottom:62px;
    width:190px;
    background:#0d1a26;
    border:1px solid var(--gold);
    border-radius:12px;
    padding:5px;
    z-index:50;
    box-shadow:0 10px 30px #000;
}

.menu button{
    width:100%;
    border:0;
    background:none;
    color:#fff;
    text-align:left;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
}

.menu button:hover{
    background:#192b3a;
    color:var(--gold2);
}

/* PLAYER */

.player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:100px;
    background:#040a10;
    border-top:1px solid #a47928;
    display:flex;
    align-items:center;
    gap:18px;
    padding:10px 4%;
    z-index:100;
}

.disc{
    width:65px;
    height:65px;
    min-width:65px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:repeating-radial-gradient(
        circle,#111 0 5px,#292929 6px,#111 9px
    );
}

.now{
    flex:1;
    min-width:0;
}

.now small{
    color:var(--gold);
    letter-spacing:2px;
}

.now h3{
    margin:4px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.now p{
    color:#9ca9b5;
    font-size:12px;
}

.controls{
    display:flex;
    align-items:center;
    gap:14px;
}

.ctrl{
    background:none;
    border:0;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.big{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#f5c65d;
    border:2px solid #ffe19a;
    font-size:20px;
    cursor:pointer;
}

.volume{
    width:130px;
}

.volume input{
    width:100%;
    accent-color:var(--gold);
}

/* MOBILE */

@media(max-width:800px){

    .head-btn{
        display:none;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .channel{
        min-height:210px;
        padding:14px 8px;
    }

    .volume{
        display:none;
    }

    .player{
        height:88px;
        padding:8px 12px;
    }

    .disc{
        display:none;
    }

    .controls{
        gap:8px;
    }

    .big{
        width:54px;
        height:54px;
    }
}

@media(max-width:480px){

    .brand h1{
        font-size:22px;
    }

    .brand small{
        font-size:8px;
        letter-spacing:4px;
    }

    .hero{
        height:280px;
    }

    .hero-content h2{
        font-size:42px;
    }

    .hero-content small{
        font-size:18px;
    }

    .hero-content p{
        font-size:12px;
        letter-spacing:5px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
    }

    .channel-icon{
        width:58px;
        height:58px;
        font-size:27px;
    }

    .channel h3{
        font-size:14px;
    }

    .channel p{
        font-size:10px;
    }

    .play{
        width:43px;
        height:43px;
    }

    .favorite,
    .more{
        width:40px;
        height:40px;
    }

    .now h3{
        font-size:14px;
    }

    .controls .ctrl:first-child{
        display:none;
    }
}

</style>
</head>


<body>

<header>

    <div class="logo"></div>

    <div class="brand">

        <h1>80s & 90s</h1>

        <small>OLD IS GOLD</small>

    </div>

    <button
        class="head-btn"
        onclick="showFavorites()">

        ♥ Favorites

    </button>

</header>


<section class="hero">

    <div class="hero-content">

        <small>
            Feel The Nostalgia
        </small>

        <h2>
            80s & 90s
        </h2>

        <p>
            OLD IS GOLD RADIO
        </p>

        <button
            onclick="playChannel(0)">

            ▶ PLAY RADIO

        </button>

    </div>

</section>


<h2 class="title">

    📻 <span>
        LEGENDARY VOICES
    </span>

</h2>


<div
    class="channels"
    id="channels">
</div>


<div class="player">

    <div class="disc"></div>

    <div class="now">

        <small>
            NOW PLAYING
        </small>

        <h3 id="nowTitle">
            Select a Radio Channel
        </h3>

        <p id="nowDesc">
            80s & 90s Old Is Gold
        </p>

    </div>


    <div class="controls">

        <button
            class="ctrl"
            onclick="previous()">

            ⏮

        </button>


        <button
            class="big"
            id="playButton"
            onclick="togglePlay()">

            ▶

        </button>


        <button
            class="ctrl"
            onclick="next()">

            ⏭

        </button>

    </div>


    <div class="volume">

        🔊

        <input
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".8"
            oninput="setVolume(this.value)">

    </div>

</div>


<audio
    id="audio"
    preload="none"
    playsinline>
</audio>


<script>

/* =====================================================
   RADIO CHANNELS
===================================================== */

const channels = [

    {
        name:"Hindi Evergreen",
        icon:"📻",
        description:
        "Lata • Kishore • Rafi • Mukesh • Asha",
        stream:
        "https://stream.zeno.fm/n2fd0edh9k8uv"
    },

    {
        name:"Kishore Kumar Radio",
        icon:"🎤",
        description:
        "Kishore Kumar • Golden Hits",
        stream:
        "https://stream.zeno.fm/0ghtfp8ztm0uv"
    },

    {
        name:"Lata Mangeshkar Radio",
        icon:"🎤",
        description:
        "Lata Mangeshkar • Evergreen Hits",
        stream:
        "https://stream.zeno.fm/87xam8pf7tzuv"
    },

    {
        name:"Goldy Mukesh",
        icon:"🎙️",
        description:
        "Mukesh • Old Is Gold",
        stream:
        "https://stream.zeno.fm/t39watus1p8uv"
    },

    {
        name:"Mohammed Rafi Radio",
        icon:"🎙️",
        description:
        "Mohammed Rafi • Golden Hits",
        stream:
        "https://stream.zeno.fm/0zkr7x8ztm0uv"
    },

    {
        name:"Radio Retro Bollywood",
        icon:"💿",
        description:
        "60s • 70s • 80s Bollywood",
        stream:
        "https://stream.zeno.fm/u0hrd3xkzhhvv"
    },

    {
        name:"Retro Bollywood 90s",
        icon:"💿",
        description:
        "80s • 90s Bollywood",
        stream:
        "https://stream.zeno.fm/fdgs82xkzhhvv"
    },

    {
        name:"Bollywood Gaane Purane",
        icon:"📻",
        description:
        "Golden Hindi Film Songs",
        stream:
        "https://stream.zeno.fm/6n6ewddtad0uv"
    },

    {
        name:"Manna Dey",
        icon:"🎤",
        description:
        "Manna Dey • Golden Classics",
        stream:
        "https://stream.zeno.fm/60ef4p33vxquv"
    }

];


/* =====================================================
   AUDIO
===================================================== */

const audio =
    document.getElementById("audio");

let current = 0;


/* =====================================================
   FAVORITES
===================================================== */

let favorites = [];

try{

    favorites =
    JSON.parse(
        localStorage.getItem(
            "oldGoldFavorites"
        ) || "[]"
    );

}catch(e){

    favorites = [];

}


/* =====================================================
   MEDIA SESSION
   LOCK SCREEN / NOTIFICATION CONTROLS
===================================================== */

function setupMediaSession(){

    if(!("mediaSession" in navigator)){

        console.log(
            "Media Session not supported"
        );

        return;

    }


    try{

        navigator.mediaSession.setActionHandler(
            "play",
            function(){

                audio.play()
                .catch(function(){});

            }
        );

    }catch(e){}


    try{

        navigator.mediaSession.setActionHandler(
            "pause",
            function(){

                audio.pause();

            }
        );

    }catch(e){}


    try{

        navigator.mediaSession.setActionHandler(
            "nexttrack",
            function(){

                next();

            }
        );

    }catch(e){}


    try{

        navigator.mediaSession.setActionHandler(
            "previoustrack",
            function(){

                previous();

            }
        );

    }catch(e){}


    try{

        navigator.mediaSession.setActionHandler(
            "stop",
            function(){

                audio.pause();

            }
        );

    }catch(e){}

}


/* =====================================================
   UPDATE LOCK SCREEN MEDIA INFORMATION
===================================================== */

function updateMediaSession(channel){

    if(!("mediaSession" in navigator))
        return;


    try{

        navigator.mediaSession.metadata =
        new MediaMetadata({

            title:
            channel.name,

            artist:
            "80s & 90s Old Is Gold",

            album:
            "Old Is Gold Radio"

        });


        navigator.mediaSession.playbackState =
        "playing";

    }catch(e){

        console.log(
            "Media Session metadata error",
            e
        );

    }

}


/* =====================================================
   CREATE CHANNEL CARDS
===================================================== */

function createCards(){

    const box =
    document.getElementById(
        "channels"
    );


    box.innerHTML = "";


    channels.forEach(
        function(channel,index){

            const fav =
            favorites.includes(index);


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "channel";


            card.innerHTML = `

                <div>

                    <div class="channel-icon">
                        ${channel.icon}
                    </div>

                    <h3>
                        ${channel.name}
                    </h3>

                    <p>
                        ${channel.description}
                    </p>

                    <div
                        class="status"
                        id="status-${index}">

                        ● HTTPS STREAM READY

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="play"
                        onclick="
                            playChannel(${index})
                        ">

                        ▶

                    </button>


                    <button
                        class="favorite ${
                            fav ? "active" : ""
                        }"
                        onclick="
                            toggleFavorite(
                                event,
                                ${index}
                            )
                        ">

                        ${fav ? "♥" : "♡"}

                    </button>


                    <button
                        class="more"
                        onclick="
                            openMenu(
                                event,
                                ${index}
                            )
                        ">

                        ⋮

                    </button>

                </div>


                <div
                    class="menu"
                    id="menu-${index}"
                    style="display:none">

                    <button
                        onclick="
                            playChannel(${index});
                            closeMenus();
                        ">

                        ▶ Play Channel

                    </button>


                    <button
                        onclick="
                            toggleFavorite(
                                event,
                                ${index}
                            );
                            closeMenus();
                        ">

                        ♥ Add / Remove Favorite

                    </button>


                    <button
                        onclick="
                            channelInfo(${index});
                            closeMenus();
                        ">

                        ℹ Channel Info

                    </button>

                </div>

            `;


            box.appendChild(card);

        }
    );

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(index){

    const channel =
    channels[index];


    if(!channel)
        return;


    current =
    index;


    document.getElementById(
        "nowTitle"
    ).textContent =
    channel.name;


    document.getElementById(
        "nowDesc"
    ).textContent =
    channel.description;


    const status =
    document.getElementById(
        "status-" + index
    );


    if(status){

        status.textContent =
        "● CONNECTING...";

        status.classList.remove(
            "off"
        );

    }


    /*
       Stop current stream
    */

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    /*
       Set new stream
    */

    audio.src =
    channel.stream;

    audio.preload =
    "none";


    audio.load();


    /*
       Start radio
    */

    audio.play()

    .then(function(){

        document.getElementById(
            "playButton"
        ).textContent =
        "❚❚";


        if(status){

            status.textContent =
            "● PLAYING";

        }


        updateMediaSession(
            channel
        );

    })

    .catch(function(error){

        console.log(
            "Playback error:",
            error
        );


        document.getElementById(
            "playButton"
        ).textContent =
        "▶";


        if(status){

            status.textContent =
            "● STREAM ERROR";

            status.classList.add(
                "off"
            );

        }

    });

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

    if(!audio.src){

        playChannel(current);

        return;

    }


    if(audio.paused){

        audio.play()
        .catch(function(){});

    }else{

        audio.pause();

    }

}


/* =====================================================
   AUDIO PLAY EVENT
===================================================== */

audio.addEventListener(
    "play",
    function(){

        document.getElementById(
            "playButton"
        ).textContent =
        "❚❚";


        if(
            "mediaSession"
            in navigator
        ){

            navigator.mediaSession
            .playbackState =
            "playing";

        }

    }
);


/* =====================================================
   AUDIO PAUSE EVENT
===================================================== */

audio.addEventListener(
    "pause",
    function(){

        document.getElementById(
            "playButton"
        ).textContent =
        "▶";


        if(
            "mediaSession"
            in navigator
        ){

            navigator.mediaSession
            .playbackState =
            "paused";

        }

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

audio.addEventListener(
    "error",
    function(){

        const status =
        document.getElementById(
            "status-" + current
        );


        if(status){

            status.textContent =
            "● RECONNECTING...";

            status.classList.add(
                "off"
            );

        }

    }
);


/* =====================================================
   NEXT
===================================================== */

function next(){

    current++;


    if(
        current >=
        channels.length
    ){

        current = 0;

    }


    playChannel(
        current
    );

}


/* =====================================================
   PREVIOUS
===================================================== */

function previous(){

    current--;


    if(current < 0){

        current =
        channels.length - 1;

    }


    playChannel(
        current
    );

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(
    event,
    index
){

    if(event){

        event.preventDefault();

        event.stopPropagation();

    }


    const position =
    favorites.indexOf(index);


    if(position === -1){

        favorites.push(
            index
        );

    }else{

        favorites.splice(
            position,
            1
        );

    }


    try{

        localStorage.setItem(
            "oldGoldFavorites",
            JSON.stringify(
                favorites
            )
        );

    }catch(e){}


    createCards();

}


/* =====================================================
   SHOW FAVORITES
===================================================== */

function showFavorites(){

    const box =
    document.getElementById(
        "channels"
    );


    box.innerHTML = "";


    const list =
    favorites
    .map(
        function(index){

            return channels[index];

        }
    )
    .filter(Boolean);


    if(list.length === 0){

        box.innerHTML = `

            <div
                style="
                grid-column:1/-1;
                text-align:center;
                padding:45px;
                color:#aaa">

                ♥ No Favorite Channels

                <br><br>

                Tap ♡ on a channel
                to save it.

                <br><br>

                <button
                    onclick="createCards()"
                    style="
                    padding:10px 22px;
                    border-radius:20px;
                    border:1px solid #e8ad3b;
                    background:#101c27;
                    color:#ffd875">

                    Show All Channels

                </button>

            </div>

        `;

        return;

    }


    list.forEach(
        function(channel){

            const index =
            channels.indexOf(
                channel
            );


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "channel";


            card.innerHTML = `

                <div>

                    <div class="channel-icon">
                        ${channel.icon}
                    </div>

                    <h3>
                        ${channel.name}
                    </h3>

                    <p>
                        ${channel.description}
                    </p>

                </div>


                <div class="actions">

                    <button
                        class="play"
                        onclick="
                            playChannel(${index})
                        ">

                        ▶

                    </button>


                    <button
                        class="favorite active"
                        onclick="
                            toggleFavorite(
                                event,
                                ${index}
                            )
                        ">

                        ♥

                    </button>

                </div>

            `;


            box.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   THREE DOT MENU
===================================================== */

function openMenu(
    event,
    index
){

    event.preventDefault();

    event.stopPropagation();


    closeMenus();


    const menu =
    document.getElementById(
        "menu-" + index
    );


    if(menu){

        menu.style.display =
        "block";

    }

}


function closeMenus(){

    document
    .querySelectorAll(
        ".menu"
    )
    .forEach(
        function(menu){

            menu.style.display =
            "none";

        }
    );

}


document.addEventListener(
    "click",
    function(){

        closeMenus();

    }
);


/* =====================================================
   CHANNEL INFO
===================================================== */

function channelInfo(index){
