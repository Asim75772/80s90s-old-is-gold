<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>80s & 90s Old Is Gold</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050b12;
    color:#fff;
    padding-bottom:105px;
}

/* HEADER */
.header{
    background:#050a11;
    border-bottom:1px solid #c99632;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 5%;
}

.brand{
    display:flex;
    align-items:center;
    gap:16px;
}

.logo{
    width:68px;
    height:68px;
    border-radius:50%;
    border:2px solid #e4ad3c;
    background:
    repeating-radial-gradient(
        circle,
        #111 0px,
        #111 4px,
        #222 5px,
        #111 7px
    );
    position:relative;
}

.logo:after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#e2a735;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.brand h1{
    font-family:Georgia,serif;
    font-size:31px;
    color:#f1bd4e;
}

.brand span{
    display:block;
    font-size:12px;
    letter-spacing:5px;
    color:#fff;
    margin-top:5px;
}

.menu{
    font-size:30px;
    color:#eab448;
}

/* BANNER */
.hero{
    width:94%;
    max-width:1250px;
    min-height:310px;
    margin:22px auto;
    border:1px solid #a97a25;
    border-radius:20px;

    background:
    radial-gradient(circle at 50% 50%,#9c5d23aa,transparent 40%),
    linear-gradient(110deg,#111820,#20160f,#0b141d);

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero:before{
    content:"📻";
    position:absolute;
    left:35px;
    bottom:15px;
    font-size:150px;
    opacity:.18;
}

.hero:after{
    content:"💿";
    position:absolute;
    right:30px;
    top:20px;
    font-size:150px;
    opacity:.16;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero small{
    color:#eeb54a;
    font-size:24px;
    font-family:Georgia,serif;
    font-style:italic;
}

.hero h2{
    font-family:Georgia,serif;
    font-size:65px;
    color:#fff5df;
    margin:8px 0;
}

.hero p{
    color:#eab34b;
    letter-spacing:8px;
    font-size:19px;
    margin-bottom:25px;
}

.hero button{
    border:0;
    background:#f5c65e;
    color:#111;
    font-size:18px;
    font-weight:bold;
    padding:15px 40px;
    border-radius:35px;
    cursor:pointer;
}

/* MAIN */
.container{
    width:94%;
    max-width:1250px;
    margin:auto;
}

.title{
    color:#eab44a;
    font-size:26px;
    margin:30px 0 18px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* RADIO GRID */
.radio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.radio-card{
    background:#081522;
    border:1px solid #304254;
    border-radius:18px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:18px;
    transition:.2s;
}

.radio-card:hover{
    border-color:#e4af42;
    transform:translateY(-2px);
}

.radio-icon{
    width:70px;
    height:70px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    background:#111d29;
    border:2px solid #d9a63c;
    flex-shrink:0;
}

.radio-info{
    flex:1;
}

.radio-info h3{
    font-size:20px;
    margin-bottom:7px;
}

.radio-info p{
    color:#aab4bf;
    font-size:14px;
}

.play{
    background:#f1bd4d;
    border:none;
    border-radius:25px;
    padding:11px 21px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.play:hover{
    background:#ffd675;
}

/* NOW PLAYING */
.now{
    margin-top:30px;
    padding:20px;
    background:#091521;
    border:1px solid #8d6728;
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:20px;
}

.now-disc{
    width:80px;
    height:80px;
    border-radius:50%;
    background:
    repeating-radial-gradient(
        circle,
        #111 0px,
        #111 5px,
        #292929 6px,
        #111 9px
    );
    border:3px solid #d7a23a;
    flex-shrink:0;
    animation:spin 6s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.now-info{
    flex:1;
}

.now-info small{
    color:#eab54d;
    letter-spacing:3px;
}

.now-info h2{
    margin:6px 0;
    font-size:24px;
}

.now-info p{
    color:#9ba7b3;
}

/* PLAYER */
.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:92px;
    background:#03080e;
    border-top:1px solid #39434d;
    display:flex;
    align-items:center;
    padding:10px 4%;
    z-index:99;
}

.player-info{
    width:35%;
}

.player-info strong{
    display:block;
    font-size:17px;
}

.player-info span{
    color:#9ba7b2;
    font-size:13px;
}

.controls{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.control{
    background:none;
    border:0;
    color:#fff;
    font-size:22px;
    cursor:pointer;
}

.main-play{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#f5c75e;
    border:2px solid #fff1c7;
    font-size:22px;
    cursor:pointer;
}

.volume{
    width:18%;
}

.volume input{
    width:100%;
    accent-color:#eab64d;
}

/* MOBILE */
@media(max-width:700px){

    .header{
        min-height:90px;
        padding:12px 20px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand h1{
        font-size:25px;
    }

    .brand span{
        font-size:9px;
        letter-spacing:4px;
    }

    .hero{
        min-height:300px;
    }

    .hero h2{
        font-size:43px;
    }

    .hero small{
        font-size:20px;
    }

    .hero p{
        font-size:14px;
        letter-spacing:5px;
    }

    .radio-grid{
        grid-template-columns:1fr;
    }

    .radio-card{
        padding:15px;
    }

    .radio-icon{
        width:58px;
        height:58px;
        font-size:28px;
    }

    .radio-info h3{
        font-size:17px;
    }

    .play{
        padding:10px 15px;
    }

    .player{
        height:85px;
        padding:10px 15px;
    }

    .player-info{
        width:45%;
    }

    .player-info strong{
        font-size:14px;
    }

    .controls{
        gap:10px;
    }

    .volume{
        display:none;
    }

}

@media(max-width:420px){

    .hero h2{
        font-size:38px;
    }

    .radio-card{
        gap:10px;
    }

    .radio-info h3{
        font-size:15px;
    }

    .radio-info p{
        font-size:12px;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="logo"></div>

        <div>
            <h1>80s & 90s</h1>
            <span>OLD IS GOLD</span>
        </div>

    </div>

    <div class="menu">☰</div>

</header>


<!-- BANNER -->

<section class="hero">

    <div class="hero-content">

        <small>Feel The Nostalgia</small>

        <h2>80s & 90s</h2>

        <p>OLD IS GOLD</p>

        <button onclick="playCurrent()">
            ▶ PLAY RADIO
        </button>

    </div>

</section>


<!-- CONTENT -->

<main class="container">

    <h2 class="title">
        📻 LIVE RADIO
    </h2>


    <div class="radio-grid" id="stations"></div>


    <!-- NOW PLAYING -->

    <div class="now">

        <div class="now-disc"></div>

        <div class="now-info">

            <small>NOW PLAYING</small>

            <h2 id="nowTitle">
                Select a Radio Station
            </h2>

            <p id="nowSubtitle">
                Choose a channel and press Play.
            </p>

        </div>

    </div>

</main>


<!-- BOTTOM PLAYER -->

<div class="player">

    <div class="player-info">

        <strong id="playerTitle">
            Select a station
        </strong>

        <span id="playerSub">
            80s & 90s Old Is Gold
        </span>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousStation()">
            ⏮
        </button>

        <button
            class="main-play"
            id="mainPlay"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextStation()">
            ⏭
        </button>

    </div>


    <div class="volume">

        🔊

        <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            oninput="changeVolume(this.value)"
        >

    </div>

</div>


<audio id="audio" preload="none"></audio>


<script>

/* =====================================
   RADIO STATIONS
   ===================================== */

const stations = [

    {
        name:"Radio Bollywood 90s",
        description:"90s Bollywood Classics",
        stream:"https://stream.zeno.fm/rm4i9pdex3cuv"
    },

    {
        name:"Hindi Retro",
        description:"Golden Hindi Retro Hits",
        stream:"https://stream.zeno.fm/v2zfmxef798uv"
    },

    {
        name:"Lata Mangeshkar Radio",
        description:"Evergreen Lata Classics",
        stream:"https://stream.zeno.fm/87xam8pf7tzuv"
    },

    {
        name:"90s Once Again",
        description:"90s Romantic & Evergreen",
        stream:"https://stream.zeno.fm/rm4i9pdex3cuv"
    },

    {
        name:"Goldy Evergreen",
        description:"Old Bollywood Golden Hits",
        stream:"https://stream.zeno.fm/n2fd0edh9k8uv"
    },

    {
        name:"Goldy Mukesh",
        description:"Mukesh Old Is Gold",
        stream:"https://stream.zeno.fm/g372rxef798uv"
    },

    {
        name:"Kishore Kumar Radio",
        description:"Kishore Kumar Classics",
        stream:"http://stream.zeno.fm/pg6rqp8ztm0uv"
    },

    {
        name:"Mirchi Top 20",
        description:"Bollywood Hindi Hits",
        stream:"https://drive.uber.radio/uber/bollywoodnow/icecast.audio"
    },

    {
        name:"Radio Retro Bollywood",
        description:"80s & 90s Evergreen",
        stream:"https://stream.zeno.fm/u0hrd3xkzhhvv"
    },

    {
        name:"Mixify 90s Hits",
        description:"90s Bollywood Hits",
        stream:"https://server.mixify.in/listen/listen/radio.mp3"
    },

    {
        name:"Radio Gaana 90s",
        description:"Retro Romantic Hits",
        stream:"https://sp14.instainternet.com/8044/stream"
    }

];


const audio =
document.getElementById("audio");

let current = 0;


/* =====================================
   CREATE RADIO CARDS
   ===================================== */

function createStations(){

    const box =
    document.getElementById("stations");

    box.innerHTML = "";

    stations.forEach((station,index)=>{

        const card =
        document.createElement("div");

        card.className =
        "radio-card";

        card.innerHTML = `

            <div class="radio-icon">
                📻
            </div>

            <div class="radio-info">

                <h3>
                    ${station.name}
                </h3>

                <p>
                    ${station.description}
                </p>

            </div>

            <button
                class="play"
                onclick="playStation(${index})">

                ▶ PLAY

            </button>

        `;

        box.appendChild(card);

    });

}


/* =====================================
   PLAY STATION
   ===================================== */

function playStation(index){

    current = index;

    const station =
    stations[index];

    audio.src =
    station.stream;

    document.getElementById("nowTitle")
        .textContent =
        station.name;

    document.getElementById("nowSubtitle")
        .textContent =
        station.description;

    document.getElementById("playerTitle")
        .textContent =
        station.name;

    document.getElementById("playerSub")
        .textContent =
        station.description;


    audio.play()
    .then(()=>{

        document.getElementById("mainPlay")
        .textContent = "❚❚";

    })
    .catch(()=>{

        document.getElementById("mainPlay")
        .textContent = "▶";

        alert(
        "এই station টি এখন browser-এ play হচ্ছে না। অন্য station চেষ্টা করুন।"
        );

    });

}


/* =====================================
   PLAY CURRENT
   ===================================== */

function playCurrent(){

    playStation(current);

}


/* =====================================
   PLAY / PAUSE
   ===================================== */

function togglePlay(){

    if(!audio.src){

        playCurrent();

        return;

    }

    if(audio.paused){

        audio.play();

        document.getElementById("mainPlay")
        .textContent = "❚❚";

    }
    else{

        audio.pause();

        document.getElementById("mainPlay")
        .textContent = "▶";

    }

}


/* =====================================
   NEXT
   ===================================== */

function nextStation(){

    current++;

    if(current >= stations.length){

        current = 0;

    }

    playStation(current);

}


/* =====================================
   PREVIOUS
   ===================================== */

function previousStation(){

    current--;

    if(current < 0){

        current = stations.length - 1;

    }

    playStation(current);

}


/* =====================================
   VOLUME
   ===================================== */

function changeVolume(value){

    audio.volume =
    Number(value);

}


/* =====================================
   START
   ===================================== */

audio.volume = 0.8;

createStations();

</script>

</body>
</html>
